{% extends 'base.html' %}{% from 'macros.html' import icon %}{% block content %}<div class="lesson-page"><div class="focusbar-bar"><a href="/aprender" class="focusbar-back" aria-label="Sair da aula (seu andamento fica salvo)">{{ icon('close') }}</a><div class="focusbar-center"><strong id="lesson-title">Aula</strong><progress id="lesson-progress" value="0" max="6" aria-label="Progresso da aula"></progress></div></div><div class="lesson-layout"><nav class="lesson-outline" aria-label="Etapas da aula"><ol>{% for label in ['Objetivos','Explicação','Exemplos','Vocabulário','Exercícios','Resumo'] %}<li data-stage-index="{{ loop.index0 }}"><span class="lesson-outlineDot">{{ loop.index }}</span>{{ label }}</li>{% endfor %}</ol></nav><div id="feature-content" class="lesson-stage"><div class="states-loading" role="status">Preparando sua aula…</div></div></div></div>{% endblock %}
