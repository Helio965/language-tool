name: Python security regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install local Redis for shared quota regression
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
          redis-server --version
      - name: Run backend/security regression
        env:
          AI_PROVIDER: mock
        run: python -m pytest -m "not browser" -q --junitxml="${{ runner.temp }}/backend-results.xml"
      - name: Annotate backend regression failures
        if: always()
        env:
          PYTEST_RESULTS_PATH: ${{ runner.temp }}/backend-results.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path(os.environ["PYTEST_RESULTS_PATH"])
          if report.exists():
              for case in ElementTree.parse(report).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      # Report static test names without bodies, credentials or parameters.
                      name = case.get("name", "unknown").split("[", 1)[0]
                      identity = case.get("classname", "pytest") + "::" + name
                      print("::error title=Backend regression::" + identity)
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Chromium journeys
        env:
          AI_PROVIDER: mock
        run: python -m pytest -m browser -q
